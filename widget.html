<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Click to Call</title>

  <!-- This is Zoho's own script. It gives us the "ZOHO" object we use
       to talk to the CRM record the widget is opened on. -->
  <script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="app">
    <h2>Click to Call</h2>

    <p id="recordInfo">Loading record...</p>

    <button id="callButton" disabled>Call</button>

    <p id="statusMessage"></p>
  </div>

  <!-- config.js first, so widget.js can read the settings in it -->
  <script src="config.js"></script>
  <script src="widget.js"></script>

</body>
</html>
